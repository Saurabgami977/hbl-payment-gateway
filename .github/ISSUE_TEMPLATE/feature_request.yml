name: Feature request
description: Suggest an addition or change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not just the API you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      render: typescript

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not require handling raw card numbers (Direct Payment is out of scope — see CONTRIBUTING.md)
          required: true
