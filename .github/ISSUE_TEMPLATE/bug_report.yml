name: Bug report
description: Something is not working as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste real credentials, live session IDs, indicators or
        cardholder data.** Redact them before submitting.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest code sample that shows the problem.
      render: typescript
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Runtime
      placeholder: Node 20.11 / Next.js 15 / Cloudflare Workers
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error output
      description: Include the error name, message and any supportCode.
      render: shell
